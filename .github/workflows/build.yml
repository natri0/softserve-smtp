name: Build project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # allow manually running

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        buildtype: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Get CMake
        uses: lukka/get-cmake@latest
      - name: Get Boost
        uses: MarkusJx/install-boost@v2.5.1
        with:
          boost_version: '1.89.0'
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -D CMAKE_BUILD_TYPE=${{ matrix.buildtype }}
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
      - name: Build
        run: |
          cmake --build build/
